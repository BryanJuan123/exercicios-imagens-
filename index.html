<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercícios - Imagens</title>
</head>
<body>
  <h1>Heróis e Jogos</h1>

  <!-- 1. Galeria com 3 imagens e alt bem descritivo -->
  <section>
    <h2>Galeria</h2>
    <img src="https://images.unsplash.com/photo-1635805737707-575885ab0820?w=600" alt="Figura de ação do Homem-Aranha em pose dinâmica com uniforme vermelho e azul e detalhes de teia">
    <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?w=600" alt="Jogador concentrado em frente a um monitor gamer com teclado e mouse iluminados em ambiente escuro">
    <img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?w=600" alt="Controle de videogame e setup de jogos com iluminação colorida sobre uma mesa escura">
  </section>

  <!-- 2. Imagem com legenda usando <figure> -->
  <section>
    <h2>Imagem com legenda</h2>
    <figure>
      <img src="https://images.unsplash.com/photo-1538481199705-c710c4e965fc?w=600" alt="Estação de jogo com monitor, periféricos e iluminação ambiente roxa e azul">
      <figcaption>Figura 1: Setup de jogos preparado para partidas e testes de desempenho.</figcaption>
    </figure>
  </section>

  <!-- 3. Imagem dentro de <a> (imagem como link) -->
  <section>
    <h2>Imagem como link</h2>
    <a href="https://store.steampowered.com" target="_blank" rel="noopener noreferrer">
      <img src="https://images.unsplash.com/photo-1552820728-8b83bb6b773f?w=600" alt="Cenário de jogos digitais com tela iluminada servindo como link para a loja Steam">
    </a>
  </section>
</body>
</html>
